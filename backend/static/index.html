<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <!-- LEFT: Timer & controls -->
    <div class="col-timer">
      <div class="header">
        <h1>Pomodoro</h1>
        <button id="btn-settings-toggle" class="settings-toggle" title="Settings">&#9881;</button>
      </div>

      <div id="settings-panel" class="settings-panel hidden">
        <h3 class="settings-section-title">Timer</h3>
        <div class="settings-row">
          <label for="cfg-work">Work (min)</label>
          <input type="number" id="cfg-work" min="1" max="120" />
        </div>
        <div class="settings-row">
          <label for="cfg-short-break">Short break (min)</label>
          <input type="number" id="cfg-short-break" min="1" max="60" />
        </div>
        <div class="settings-row">
          <label for="cfg-long-break">Long break (min)</label>
          <input type="number" id="cfg-long-break" min="1" max="60" />
        </div>
        <div class="settings-row">
          <label for="cfg-cycles">Cycles before long break</label>
          <input type="number" id="cfg-cycles" min="1" max="20" />
        </div>

        <h3 class="settings-section-title">Schedule</h3>
        <div class="settings-row">
          <label>Work hours</label>
          <div class="time-range">
            <select id="cfg-day-start"></select>
            <span>to</span>
            <select id="cfg-day-end"></select>
          </div>
        </div>
        <div class="settings-row">
          <label>Lunch</label>
          <div class="time-range">
            <select id="cfg-lunch-time"></select>
            <span>for</span>
            <select id="cfg-lunch-duration">
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
            </select>
          </div>
        </div>

        <button id="btn-save-config">Save</button>
      </div>

      <div id="timer" class="timer">00:00</div>
      <div id="mode-label" class="mode-label">idle</div>
      <div id="status-label" class="status-label">stopped</div>
      <div id="cycle-label" class="cycle-label">Cycle 1</div>
      <div id="intent-label" class="intent-label"></div>

      <div class="controls">
        <input type="text" id="intent-input" placeholder="Intent (optional)" />
        <div id="buttons" class="buttons"></div>
      </div>

      <div class="distraction-section">
        <input type="text" id="distraction-input" placeholder="What distracted you?" />
        <button id="btn-distraction">Distraction</button>
        <span id="distraction-count" class="distraction-count">0</span>
      </div>

      <div class="note-section">
        <input type="text" id="note-input" placeholder="Add a note..." />
        <button id="btn-note">Add Note</button>
      </div>

      <h2>History</h2>
      <ul id="event-list" class="event-list"></ul>
    </div>

    <!-- RIGHT: Day timeline -->
    <div class="col-plan">
      <h2>Today</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
